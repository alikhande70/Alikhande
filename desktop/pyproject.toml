[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alikhande-scanner-desktop"
version = "2.0.0"
description = "A standalone Windows scanner that uses MetaTrader 5 as a data and execution gateway"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45 ; sys_platform == 'win32'"]

[project.scripts]
alikhande = "alikhande.__main__:main"

[tool.setuptools.packages.find]
include = ["alikhande*"]

[tool.ruff]
line-length = 100
target-version = "py310"
